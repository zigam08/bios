<main>
<section class="page-header"><p class="eyebrow">04 · MULTIMEDIJA</p><h1>Multimedija</h1></section>
<section class="section">
  <div class="media-grid">
    <div class="pdf-container">
        <iframe
            src="predstavitev.pdf"
            title="PowerPoint predstavitev"
            class="pdf-viewer"
            allowfullscreen>
        </iframe>

        <button class="fullscreen-btn"
            onclick="odpriFullscreen(this)">
            ⛶ Povečaj na celoten zaslon
        </button>
    </div>

    <script>
    function odpriFullscreen(gumb) {
        const pdf = gumb.parentElement.querySelector("iframe");

        if (pdf.requestFullscreen) {
            pdf.requestFullscreen();
        } else if (pdf.webkitRequestFullscreen) {
            pdf.webkitRequestFullscreen();
        }
    }
    </script>
    <div class="video-placeholder">
    <video controls width="100%">
        <source src="video.mp4" type="video/mp4">
        Tvoj brskalnik ne podpira predvajanja videa.
    </video>
</div>
  </div>
</section>
</main>


<script src="js/main.js"></script>
